[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxtype"
version = "0.1.0"
description = "VoxType — Cross-platform offline voice typing. Hold a key, speak, text appears."
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "pynput>=1.7.6",
    "pystray>=0.19",
    "Pillow>=10.0",
    "pyperclip>=1.8",
]

[project.optional-dependencies]
macos = ["mlx-whisper>=0.4", "lightning-whisper-mlx>=0.0.10", "pyobjc-framework-Cocoa>=10.0"]
vad = ["silero-vad>=5.1"]

[project.scripts]
voxtype = "voice_typing.__main__:main"
voice-typing = "voice_typing.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
