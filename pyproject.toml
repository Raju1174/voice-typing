[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-typing"
version = "0.1.0"
description = "Cross-platform voice typing app — hold a key, speak, text appears"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "pynput>=1.7.6",
    "pystray>=0.19",
    "Pillow>=10.0",
    "pyperclip>=1.8",
]

[project.scripts]
voice-typing = "voice_typing.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
